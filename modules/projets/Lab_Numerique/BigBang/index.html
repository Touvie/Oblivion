<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Bang</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container"></div>

    <div id="controls">
        <div class="title">Contrôles Big Bang 💥</div>
        <button id="btn-start"  class="ctrl-btn">Démarrer</button>
        <button id="btn-pause"  class="ctrl-btn hidden">⏸️ Pause</button>
        <button id="btn-reset"  class="ctrl-btn hidden">🔄 Réinitialiser</button>
        <div id="speed-label"    class="ctrl-label hidden">Vitesse: 1.0x</div>
        <input  id="speed-range" type="range" class="ctrl-range hidden" min="0.1" max="3" step="0.1" value="1">
        <div id="progress-label"  class="ctrl-label hidden">Progression: 0%</div>
        <input  id="progress-range" type="range" class="ctrl-range hidden" min="0" max="1" step="0.01" value="0">
        <div id="phase-box"     class="ctrl-box hidden">🌑 Contraction</div>
        <div id="loop-box"      class="ctrl-loop hidden">
            <input type="checkbox" id="loop-check">
            <label for="loop-check">🔁 Répéter en boucle</label>
        </div>
        <div id="status-box"    class="ctrl-box hidden">État: EN LECTURE ▶️</div>
    </div>

    <div id="help">🖱️ Cliquer-glisser pour tourner<br>🔍 Molette pour zoomer</div>
    <div id="bottom-title">Sphère — Big Bang contrôlable</div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
