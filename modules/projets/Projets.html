<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projets - Galerie</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Projets.css">
</head>
<body>

<div class="gallery-viewport">
    <div class="gallery-canvas" id="gallery">

        <!-- PORTFOLIO - Grand Paysage -->
        <div class="frame frame-large-landscape frame-portfolio" data-project="portfolio" style="left: 50vw; top: 50vh;">
            <div class="frame-label">Portfolio Interactif</div>
        </div>

        <!-- Affiche4 - Grand Paysage -->
        <div class="frame frame-large-landscape frame-affiche" data-project="affiche4" style="left: 105vw; top: 50vh;">
            <img src="images/Avril.webp" alt="Hermes" class="frame-image">
            <div class="frame-label"> Avril 2026</div>
        </div>

        <!-- HERMÈS - Moyen -->
        <div class="frame frame-medium frame-hermes" data-project="hermes" style="left: 10vw; top: 30vh;">
            <!-- FIX: Images/ → images/ -->
            <img src="images/Hermes.webp" alt="Hermes" class="frame-image">
            <div class="frame-label">Éditions Hermès</div>
        </div>

        <!-- STOP MOTION - Moyen -->
        <div class="frame frame-medium frame-escale" data-project="escale" style="left: 78vw; top: 28vh;">
            <img src="images/Escale.webp" alt="Pas Prévu" class="frame-image">
            <div class="frame-label">Stop Motion - Pas prévu</div>
        </div>

        <!-- FRISE - Moyen -->
        <div class="frame frame-medium frame-frise" data-project="frise" style="left: 140vw; top: 30vh;">
            <img src="images/Frise.webp" alt="Frise" class="frame-image">
            <div class="frame-label">Frise Chronologique</div>
        </div>

        <!-- AFFICHE 1 - Small -->
        <div class="frame frame-small frame-affiche" data-project="affiche" style="left: 25vw; top: 75vh;">
            <img src="images/Big_Brother.webp" alt="Big Brother" class="frame-image">
            <div class="frame-label">Janvier 2026</div>
        </div>

        <!-- AFFICHE 2 - Small -->
        <div class="frame frame-small frame-affiche" data-project="affiche2" style="left: 85vw; top: 75vh;">
            <img src="images/Fevrier.webp" alt="Vitrail arc en ciel" class="frame-image">
            <div class="frame-label">Février 2026</div>
        </div>

         <!-- AFFICHE 3 - Small (Vinyle circulaire) -->
        <div class="frame frame-small frame-affiche frame-vinyl" data-project="affiche3" style="left: 125vw; top: 25vh;">
            <img src="images/Mars.webp" alt="Zootrope Vinyle" class="frame-image">
            <div class="frame-label">Mars 2026</div>
        </div>

        <!-- ITALIE - Small -->
        <div class="frame frame-small frame-italie" data-project="italie" style="left: 68vw; top: 75vh;">
            <img src="images/Rome.webp" alt="Image du colisée" class="frame-image">
            <div class="frame-label">Projet Italie</div>
        </div>

        <!-- FIGMA - Small -->
        <div class="frame frame-small frame-figma" data-project="figma" style="left: 30vw; top: 25vh;">
            <img src="images/Projets_Figma.webp" alt="Splash de Figma" class="frame-image">
            <div class="frame-label">Animation Figma</div>
        </div>

        <!-- AFFICHE 5 - Small (Mai) -->
        <div class="frame frame-small frame-affiche" data-project="affiche5" style="left: 130vw; top: 75vh;">
            <div class="frame-placeholder">
                <div class="frame-placeholder-icon">⏳</div>
                <div>En cours</div>
            </div>
            <div class="frame-label">Mai 2026</div>
        </div>

        <!-- GÉOLIBRI - Medium -->
        <div class="frame frame-medium frame-affiche" data-project="geolibri" style="left: 160vw; top: 65vh;">
            <img src="images/geolibri.webp" alt="logo de la geolibri" class="frame-image">
            <div class="frame-label">Site Géolibri</div>
        </div>

        <!-- DIAPORAMA MOSCOU - Medium -->
        <div class="frame frame-small frame-affiche" data-project="moscou" style="left: 160vw; top: 20vh;">
            <img src="images/Metro.webp" alt=" affiche de terexobo" class="frame-image">
            <div class="frame-label">Metro Moscovite</div>
        </div>

        <!-- LABORATOIRE NUMÉRIQUE - Medium -->
        <div class="frame frame-medium frame-affiche" data-project="lab" style="left: 180vw; top: 40vh;">
            <video autoplay loop muted playsinline class="frame-image"><source src="videos/BigBang.webm" type="video/webm"></video>
            <div class="frame-label">Laboratoire Numérique</div>
        </div>

    </div>
</div>

<div class="nav-hint">Scroll</div>

<!-- Modale -->
<div class="project-modal" id="modal">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-content">
        <button class="modal-close" id="modal-close">Fermer [X]</button>
        <div class="modal-inner">
            <h2 class="modal-title" id="modal-title"></h2>
            <div class="modal-tags" id="modal-tags"></div>
            <div class="modal-body" id="modal-body"></div>
            <div id="modal-footer"></div>
        </div>
    </div>
</div>

<div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <img class="lightbox-content" id="lightbox-img">
    <div id="lightbox-caption"></div>
</div>

<script src="Projets.js"></script>
</body>
</html>
